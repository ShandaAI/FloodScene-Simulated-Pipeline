<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motion Generation Demo</title>
    <link rel="stylesheet" href="/static/css/style.css?v=single-clean">
</head>
<body>
    <main class="container">
        <header class="header">
            <h1>Motion Generation Demo</h1>
        </header>

        <section class="controls">
            <div class="status-group">
                <div class="status-item">
                    <span class="status-label">Status:</span>
                    <span id="status" class="status-value">Idle</span>
                </div>
                <div class="status-item">
                    <span class="status-label">FPS:</span>
                    <span id="fps" class="status-value">0</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Frames:</span>
                    <span id="frameCount" class="status-value">0</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Latency:</span>
                    <span id="latency" class="status-value">0.00s</span>
                </div>
            </div>

            <div class="input-mode-group" role="group" aria-label="Input mode">
                <button id="onlineModeBtn" class="mode-btn active" type="button">Online</button>
                <button id="offlineModeBtn" class="mode-btn" type="button">Offline</button>
            </div>

            <div id="onlineInputPanel" class="input-panel">
                <div class="input-group">
                    <label for="motionText">Online Text:</label>
                    <input
                        id="motionText"
                        type="text"
                        placeholder="Type text and press Enter"
                        value="walk in a circle."
                    >
                </div>
            </div>

            <div id="offlineInputPanel" class="input-panel offline-panel" hidden>
                <div class="offline-schedule-header">
                    <span>Offline Text Schedule</span>
                    <button id="addCueBtn" class="btn btn-compact" type="button">Add Cue</button>
                </div>
                <div id="offlineScheduleRows" class="offline-schedule"></div>
            </div>

            <div class="button-group">
                <button id="startResetBtn" class="btn btn-primary" type="button">Start</button>
                <button id="configBtn" class="btn" type="button">Config</button>
            </div>

        </section>

        <section id="canvas-container" aria-label="Streaming motion viewer">
            <canvas id="renderCanvas"></canvas>
        </section>

    </main>

    <div id="configModal" class="modal-overlay" hidden>
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="configTitle">
            <div class="modal-header">
                <h2 id="configTitle">Config</h2>
            </div>
            <div class="modal-body">
                <div class="config-field">
                    <label for="modalSeed">Seed</label>
                    <input id="modalSeed" type="number" min="0" max="2147483647" value="11">
                </div>
                <div class="config-field">
                    <label for="modalSmooth">Smooth</label>
                    <div class="slider-container">
                        <input id="modalSmooth" type="range" min="0" max="1" step="0.05" value="0">
                        <span id="modalSmoothValue" class="slider-value">0.00</span>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="configDiscardBtn" class="btn btn-secondary" type="button">Discard</button>
                <button id="configSaveBtn" class="btn btn-primary" type="button">Update &amp; Reset</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    <script src="/static/js/avatars/base-avatar.js"></script>
    <script src="/static/js/avatars/g1-avatar.js"></script>
    <script src="/static/js/avatars/smplx-avatar.js"></script>
    <script src="/static/js/avatars/avatar-factory.js"></script>
    <script src="/static/js/main.js?v=smooth-zero-buttons-clean"></script>
</body>
</html>
